# `docker compose pull && docker compose up -d` and nothing else: the image is
# built on GitHub (.github/workflows/docker.yml). `docker compose up -d
# --build` builds it here instead. Settings come from `.env` in this directory
# (see docs/self-host.md).

services:
  # The one image: Bun serving the web app and the API from the same process.
  server:
    image: ghcr.io/samdc73/dotbook:latest
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      WEB_ROOT: /src/app/dist
    ports:
      # HTTP — LAN, localhost, the internal healthcheck. HTTPS answers once
      # TLS_CERT and TLS_KEY are set (the secure context web push needs).
      - "80:3000"
      - "443:8443"
    volumes:
      - data:/data
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Push when the browser is closed, and UnifiedPush for Android. Plain HTTP
  # inside the network until it gets TLS and a published port of its own —
  # the Push section of docs/self-host.md turns both on with the same cert
  # files as the app.
  ntfy:
    image: binwiederhier/ntfy
    command: serve
    environment:
      NTFY_BASE_URL: https://${DOMAIN}:8444
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      # Web Push (browser closed). Generate once with `ntfy webpush keys`;
      # leave unset until then and ntfy still serves Android via UnifiedPush.
      NTFY_WEB_PUSH_PUBLIC_KEY: ${NTFY_WEB_PUSH_PUBLIC_KEY:-}
      NTFY_WEB_PUSH_PRIVATE_KEY: ${NTFY_WEB_PUSH_PRIVATE_KEY:-}
      NTFY_WEB_PUSH_FILE: /var/cache/ntfy/webpush.db
      NTFY_WEB_PUSH_EMAIL_ADDRESS: ${NTFY_WEB_PUSH_EMAIL_ADDRESS:-}
    volumes:
      - ntfy:/var/cache/ntfy
      - ./certs:/certs:ro
    restart: unless-stopped

volumes:
  data:          # the one SQLite file — back this up
  ntfy:

# The two self-hosting images, built here and published to GHCR on every push
# to main, so a box that self-hosts can `docker compose pull` instead of
# building (docs/self-host.md). `server` is the Bun API, `web` is Caddy with
# the exported web app — the same two targets docker-compose.yml builds.
name: Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [server, web]
    steps:
      - uses: actions/checkout@v4
      # The runner's own builder: no BuildKit image to pull from Docker Hub.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names must be lower case; the repository owner may not be.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dotbook-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

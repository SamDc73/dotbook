// Dotbook's home-screen widget and quick-settings tile. No JavaScript side: the
// two only open the app at dotbook:///?compose=1. Autolinked from app/modules.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.dotbook'
version = '1.0.0'

// Expo's plugin names the module's publication from these three.
android {
  namespace "dev.dotbook.quicklog"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}
